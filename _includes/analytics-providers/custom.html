<!-- start custom analytics snippet -->
{% if jekyll.environment == 'production' and site.analytics.umami.host and site.analytics.umami.website_id %}
<script defer src="{{ site.analytics.umami.host | escape }}/script.js"
        data-website-id="{{ site.analytics.umami.website_id | escape }}"
        data-domains="{{ site.analytics.umami.domains | escape }}"></script>
{% endif %}
<!-- end custom analytics snippet -->
