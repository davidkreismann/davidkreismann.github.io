# Workflow for building and deploying an Academic Pages / Jekyll site to GitHub Pages
name: Deploy site to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.332.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 0
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      # The CV PDF is generated from _data/cv.yml via _pages/cv-pdf.tex
      - name: Compile CV PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: David_Kreismann_CV.tex
          working_directory: _site/files
      - name: Remove LaTeX sources and build files
        run: sudo find _site/files -name 'David_Kreismann_CV.*' ! -name '*.pdf' -delete
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Shrink icon fonts to the icons in use
        run: |
          pip install fonttools brotli
          python .github/scripts/subset_icon_fonts.py _site
      - name: Check internal links
        # html-proofer silently skips pages with umlauts unless the locale is UTF-8
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          gem install html-proofer --no-document
          htmlproofer _site --disable-external --swap-urls '^https\://xdavld\.github\.io:' --allow-missing-href --ignore-empty-alt
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
